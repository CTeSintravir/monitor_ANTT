name: Monitor ANTT

on:
  schedule:
    - cron: "0 11,21 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Instalar libs
        run: pip install -r requirements.txt

      - name: Rodar script
        run: python main.py
